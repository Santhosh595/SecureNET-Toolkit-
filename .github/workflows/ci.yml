name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r FileGuard-AES-SHA256/requirements.txt
          pip install -r network-sniffer/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        run: pytest -q FileGuard-AES-SHA256/test_main.py network-sniffer/test_sniffer.py
