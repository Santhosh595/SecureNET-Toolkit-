# CI: run the test suites on every push to main and every PR targeting it.
#
# This repo is a collection of standalone tools, each with its own
# requirements.txt. Two of them have real pytest suites:
#
#   FileGuard-AES-SHA256/test_main.py  -- encryption, hashing, key handling
#   network-sniffer/test_sniffer.py    -- detection database and detectors
#
# The other sub-projects have no tests. Their API test files under
# APIGuard/tests/ are OWASP API Security Top 10 test definitions
# (api1_bola.py, api7_ssrf.py, ...), not pytest modules, and are not
# collected here.
#
# The suites need no network and no display: tkinter is imported by
# FileGuard's main.py but never opens a window in the tested code paths.
#
# Actions are pinned by full SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest

      - name: Run test suites
        run: |
          python -m pytest FileGuard-AES-SHA256/test_main.py -v
          python -m pytest network-sniffer/test_sniffer.py -v
